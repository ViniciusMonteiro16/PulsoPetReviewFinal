<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Nova senha</title>

    <link rel="stylesheet"
    href="novasenha.css">

    <link rel="preconnect"
    href="https://fonts.googleapis.com">

    <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
</head>

<body>

    <nav class="nav">

        <img src="logocontraste.png"
        class="logo">

        <div class="TextoNav">

            <a href="homeuser.html">
                <h3>Início</h3>
            </a>

            <a href="TodosProdutos.html">
                <h3>Produtos</h3>
            </a>

            <a href="sobre.html">
                <h3>Sobre</h3>
            </a>

            <a href="criarconta.html">
                <img class="perfil"
                src="user.png">
            </a>

        </div>

    </nav>

    <section class="container">

        <div class="card">

            <img src="logocontraste.png"
            class="logo-card">

            <h1>Nova senha</h1>

            <div class="campo">

                <label>Insira sua nova senha</label>

                <div class="senha-area">

                    <input type="password"
                    id="novaSenha"
                    placeholder="Digite sua nova senha">

                    <span onclick="mostrarSenha('novaSenha')"></span>

                </div>

            </div>

            <div class="campo">

                <label>Confirmar senha</label>

                <div class="senha-area">

                    <input type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua senha">

                   <span onclick="mostrarSenha('confirmarSenha')"></span>

                </div>

            </div>

            <button onclick="salvarSenha()">
                Confirmar
            </button>

        </div>

    </section>

    <footer>

        <div class="links-footer">

            <a href="sobre.html">Quem somos</a>
            <a href="minhaconta.html">Meu cadastro</a>
            <a href="contato.html">Fale conosco</a>

        </div>

        <div class="footer-baixo">

            <div>

                <h4>Formas de pagamento</h4>

                <div class="pagamentos">
                    <img src="pagamento.png">
                </div>

            </div>

            <div>

                <h4>Redes sociais</h4>

                <div class="social">

                    <a href="https://instagram.com"
                    target="_blank">

                        <img src="insta.png">

                    </a>

                </div>

            </div>

            <img src="logocontraste.png"
            class="logo-footer">

        </div>

    </footer>

    <script src="novasenha.js"></script>

</body>

</html>
